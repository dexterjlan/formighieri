<!DOCTYPE html>
<html lang="pt-BR" data-theme="formighieri-sage">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGP - Formighieri Gestão de Processo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fm: {
                            canvas: '#e8ebe3',
                            surface: '#f4f6f1',
                            ink: '#1f2a1e',
                            sage: '#6b7f5a',
                            'sage-deep': '#3d4f36',
                            accent: '#c45c3e',
                            brass: '#a8926a',
                            border: '#c8d0c0'
                        }
                    },
                    fontFamily: {
                        display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['Outfit', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/identity-tokens.css?v=20261044">
    <link rel="stylesheet" href="css/identity-theme.css?v=20261048">
    <link rel="stylesheet" href="css/identity-theme-screens.css?v=20261046">
    <link rel="stylesheet" href="css/app.css?v=20261057">
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <div id="app-root"></div>
    <div id="app-session-loading"
        class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/45 backdrop-blur-sm p-6"
        style="z-index: 9999;"
        aria-hidden="true">
        <div class="bg-white rounded-2xl shadow-xl px-8 py-7 w-full max-w-sm text-center">
            <div class="mx-auto mb-4 h-10 w-10 rounded-full border-2 border-slate-200 border-t-amber-600 animate-spin"
                aria-hidden="true"></div>
            <p id="app-session-loading-msg" class="text-sm font-semibold text-slate-800">Carregando...</p>
            <p id="app-session-loading-detail" class="text-xs text-slate-400 mt-1">Aguarde um instante</p>
        </div>
    </div>
        <script src="js/bootstrap.js?v=1.0.29"></script>
</body>

</html>
